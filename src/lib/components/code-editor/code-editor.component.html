@if (!diff) {
	<ngx-monaco-editor
		[options]="editorOptions()"
		[(ngModel)]="value"
		[style.width]="width"
		[style.height]="height"
		(onInit)="onMonacoEditorInit($event)"
	/>
} @else {
	<ngx-monaco-diff-editor
		[options]="editorOptions()"
		[originalModel]="originalModel()"
		[modifiedModel]="modifiedModel()"
		[style.width]="width"
		[style.height]="height"
		(onInit)="onMonacoEditorInit($event)"
	/>
}
