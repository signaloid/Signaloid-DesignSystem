		<meta charset="utf-8" />
		<title>ECharts</title>
		<!-- Include the ECharts file you just downloaded -->
		<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
		<script src="distributionalValue.js"></script>

	<body>
		<!-- Prepare a DOM with a defined width and height for ECharts -->
		<div id="main" style="width: 600px; height: 400px"></div>

			// Initialize the echarts instance based on the prepared dom
			var chartDom = document.getElementById("main");
			var myChart = echarts.init(chartDom);
			var option;

			function binRenderer(params, api) {
				// Shape of each bin
				const boundaryPosition = api.value(0);
				const boundaryPositionN = api.value(1);
				const binHeight = api.value(2);
				var start = api.coord([boundaryPosition, binHeight]);
				var size = api.size([boundaryPositionN - boundaryPosition, binHeight]);

				// Bin styling
				var paletteDecal = api.visual("decal");
				var style = api.style();
				style.decal = paletteDecal;

				return {
					type: "rect",
					shape: {
						x: start[0],
						y: start[1],
						width: size[0],
						height: size[1],
					},
					style: style,
				};
			}

			function diracDeltaRenderer(params, api) {
				const diracDeltaPosition = api.value();
				const points = [api.coord([diracDeltaPosition, 0]), api.coord([diracDeltaPosition, 1])];
				var style = api.style({
					stroke: api.visual("color"),
					fill: "none",
				});

				return {
					type: "polyline",
					shape: {
						points: points,
					},
					style: style,
				};
			}

			function diracDeltaArrowRenderer(params, api) {
				const diracDeltaPosition = api.value();
				const position = api.coord([diracDeltaPosition, 1]);

				const shape = {
					points: [
						[0, 0],
						[-6, 10],
						[6, 10],
					],
				};

				var style = api.style({
					stroke: api.visual("color"),
					fill: api.visual("color"),
				});

				return {
					type: "polygon",
					x: position[0],
					y: position[1],
					shape: shape,
					style: style,
				};
			}

			function specialValueBarRenderer(params, api) {
				const diracDeltaPosition = api.value();
				const position = api.coord([diracDeltaPosition, 1]);

				const shape = {
					points: [
						[0, 0],
						[-6, 10],
						[6, 10],
					],
				};

				var style = api.style({
					stroke: api.visual("color"),
					fill: api.visual("color"),
				});

				return {
					type: "bar",
					x: position[0],
					y: position[1],
					shape: shape,
					style: style,
				};
			}

			function tooltipFormatter(params) {
				return `Probability Mass<br />
			           				${params.data.value[3]}`;
			}
