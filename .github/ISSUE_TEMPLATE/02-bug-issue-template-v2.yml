name: 🐛 Bug Issue Template
description: A default template for issues that fix a known bug
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit this new bug issue.
        Please assign it to an employee (or team lead if that is uncertain), so it can be triaged efficiently.

  - type: markdown
    attributes:
      value: "## Overview"

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: Please provide a clear and concise description of the bug.
      placeholder: e.g., XXX is not working
    validations:
      required: true

  - type: textarea
    id: how_to_reproduce
    attributes:
      label: How to Reproduce
      description: Please provide steps to reproduce the behavior.
      placeholder: |
        1. E.g., `make` in directory `foo`...
        2. See error.
    validations:
      required: false

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behaviour
      description: A clear and concise description of what you expected to happen.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## Environment"

  - type: input
    id: version
    attributes:
      label: Version(s) or Release(s) affected
      placeholder: e.g., v2.20
    validations:
      required: false

  - type: input
    id: host_environment
    attributes:
      label: Hosting Platform and Version
      placeholder: e.g., macOS 27.1 / Verilator 5.032
    validations:
      required: false

  - type: textarea
    id: local_changes
    attributes:
      label: Your local changes which present the bug
      placeholder: |
        - HEAD git hash:
        - Output of `git diff`.
        - Output of `git remote -v`.
    validations:
      required: false

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Items that must be completed for this task to be considered resolved.
      value: |
        - Meets the Signaloid organization [coding and file naming conventions](https://github.com/signaloid/signaloid-conventions).
        - Passes standalone/unit test (only applicable to code/RTL).
        - Passes integration test when integrated into system (only applicable to code/RTL).
        - Passes end-to-end integration test (for cloud-based signup/billing issues)
        - Meets Signaloid's UI/UX quality standards (for product issues).
        - Confirmed with the original person who raised/filed the issue that the implementation addresses its spirit.

  - type: markdown
    attributes:
      value: "## Extra Context"

  - type: textarea
    id: related_issues
    attributes:
      label: Related Issues
      placeholder: "- #123"
      description: List, and link to, all existing issues that impact this bug.
    validations:
      required: false

  - type: textarea
    id: diagrams_screenshots
    attributes:
      label: Diagrams and Screenshots
      description: If applicable, drag and drop images here.
    validations:
      required: false

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Add any other context about the bug here.
    validations:
      required: false
