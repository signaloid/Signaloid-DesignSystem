name: "🛠️ Code Refactor Issue Template"
description: Use this for improving existing code structure, readability, or formatting without changing functionality.
type: "refactor"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to submit this refactoring issue.
        This issue should not involve adding new features or changing existing logic.
        Please assign it to an employee (or team lead if that is uncertain), so it can be triaged efficiently.

  - type: markdown
    attributes:
      value: "## Overview"

  - type: textarea
    id: refactor-scope
    attributes:
      label: Scope of Refactor
      description: Which modules, files, or functions are being targeted?
    validations:
      required: true

  - type: dropdown
    id: refactor-reason
    attributes:
      label: Primary Motivation
      multiple: true
      options:
        - Improve Readability / Clean Code
        - Reduce Code Duplication (DRY)
        - Performance Optimization (Internal)
        - Update to Signaloid Coding Standards
        - Decoupling / Modularization
        - Other
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State and Pain Points
      description: What is difficult about the current implementation?
      placeholder: "e.g., The current function is 500 lines long and difficult to unit test."
    validations:
      required: false

  - type: textarea
    id: proposed-changes
    attributes:
      label: Proposed Improvements
      description: How will you restructure the code? 
      placeholder: e.g., Splitting the main loop into three helper functions.
    validations:
      required: false

  - type: markdown
    attributes:
      value: "## Implementation"

  - type: textarea
    id: regression-plan
    attributes:
      label: Regression Testing Plan
      description: How will we prove that functionality remains identical after the change?
      placeholder: e.g., Running the existing CI test suite and comparing binary output.
    validations:
      required: true

  - type: textarea
    id: refactor_acceptance_criteria
    attributes:
      label: Refactor Acceptance Criteria
      value: |
        - No functional changes or new features introduced.
        - All existing unit and integration tests pass.
        - Code meets the Signaloid [coding conventions](https://github.com/signaloid/signaloid-conventions).
        - Documentation/Comments updated to reflect the new structure.
        - Peer review confirms improved readability or maintainability.

  - type: markdown
    attributes:
      value: "## Extra Context"

  - type: textarea
    id: related_issues
    attributes:
      label: Related Issues
      placeholder: "- #123"
      description: List and link to all existing issues that impact this refactor.
    validations:
      required: false

  - type: textarea
    id: diagrams_screenshots
    attributes:
      label: Diagrams and Screenshots
      description: If applicable, drag and drop images here.
    validations:
      required: false

  - type: textarea
    id: additional_notes
    attributes:
      label: Additional Notes
      description: Add any other context about the refactor here.
    validations:
      required: false
